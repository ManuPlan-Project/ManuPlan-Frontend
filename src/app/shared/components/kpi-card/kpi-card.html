<div class="kpi-card" [ngClass]="variant">
  <div class="kpi-head">
    <div class="kpi-label">{{ label }}</div>
    <div class="kpi-icon">
      <i class="ti {{ icon }}"></i>
    </div>
  </div>
  <div class="kpi-value">{{ value }}</div>
  @if (delta) {
    <div class="kpi-delta" [ngClass]="deltaType">
      {{ delta }}
    </div>
  }
</div>
