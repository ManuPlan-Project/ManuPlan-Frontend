<div class="pagination d-flex align-items-center justify-content-between flex-wrap gap-2" *ngIf="totalPages() > 0">
  <span class="pagination__info">
    {{ start() }}–{{ end() }} of {{ totalItems() }}
  </span>

  <div class="pagination__controls d-flex align-items-center gap-3">
    <button class="pagination__btn d-flex align-items-center justify-content-center"
            [disabled]="currentPage() === 1"
            (click)="prev()">
      <span aria-hidden="true">←</span>
    </button>

    <span class="pagination__pages text-center">
      {{ currentPage() }} / {{ totalPages() }}
    </span>

    <button class="pagination__btn d-flex align-items-center justify-content-center"
            [disabled]="currentPage() === totalPages()"
            (click)="next()">
      <span aria-hidden="true">→</span>
    </button>
  </div>
</div>
