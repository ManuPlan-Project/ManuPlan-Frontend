<div class="users-page">

  <app-page-header title="User Management" subtitle="Manage users, roles and permissions">
    <button class="btn btn-primary" (click)="openModal()">
      <tabler-icon [icon]="userPlusIcon" [size]="15" />
      Add user
    </button>
  </app-page-header>

  <div class="search-wrap">
    <tabler-icon class="search-icon" [icon]="searchIcon" [size]="15" />
    <input
      class="search-input"
      placeholder="Search by name, email or role..."
      [value]="searchQuery()"
      (input)="searchQuery.set($any($event.target).value); currentPage.set(1)"
    />
  </div>

  <div class="card">
    @if(isLoading()) {
      <div class="loading">Loading users...</div>
    } @else {
      <table class="tbl">
        <thead>
          <tr>
            <th>User</th>
            <th>Role</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for(user of paginatedUsers(); track user.userId) {
            <tr>
              <td>
                <div class="user-cell">
                  <div class="user-av">{{ user.name.substring(0,2).toUpperCase() }}</div>
                  <div>
                    <div class="user-name">{{ user.name }}</div>
                    <div class="user-email">{{ user.email }}</div>
                  </div>
                </div>
              </td>
              <td><span class="role-pill">{{ user.role }}</span></td>
              <td><app-status-badge [label]="user.status" [variant]="user.status.toLowerCase()" /></td>
              <td class="mono-text">{{ user.createdAt | date: 'MMM d, y' }}</td>
              <td>
                <div class="action-btns">
                  <button class="action-btn"
                    (click)="updateStatus(user.userId, user.status === 'Active' ? 'Inactive' : 'Active')">
                    <tabler-icon [icon]="shieldIcon" [size]="14" />
                  </button>
                  <button class="action-btn action-btn--danger" (click)="deleteUser(user.userId)">
                    <tabler-icon [icon]="trashIcon" [size]="14" />
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalItems]="filteredUsers().length"
        [pageSize]="pageSize"
        (pageChange)="currentPage.set($event)" />
    }
  </div>

</div>

<!-- Modal — ng-template se document.body mein jayega -->
<ng-template #modalTpl>
  <div class="modal-overlay" (click)="closeModal()">
    <div class="modal" (click)="$event.stopPropagation()">

      <div class="modal-head">
        <h3>Add new user</h3>
        <button class="modal-close" (click)="closeModal()">
          <tabler-icon [icon]="closeIcon" [size]="16" />
        </button>
      </div>

      <div class="input-grp">
        <label class="input-l">Full name</label>
        <input class="input" type="text" placeholder="Priya Sharma" [(ngModel)]="newUser.name" />
      </div>

      <div class="input-grp">
        <label class="input-l">Work email</label>
        <input class="input" type="email" placeholder="priya@company.com" [(ngModel)]="newUser.email" />
      </div>

      <div class="input-grp">
        <label class="input-l">Password</label>
        <input class="input" type="password" placeholder="Min 8 chars" [(ngModel)]="newUser.password" />
      </div>

      <div class="input-grp">
        <label class="input-l">Role</label>
        <select class="input" [(ngModel)]="newUser.role">
          @for(role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </div>

      <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;" (click)="addUser()">
        <tabler-icon [icon]="userPlusIcon" [size]="15" />
        Create user
      </button>

    </div>
  </div>
</ng-template>
